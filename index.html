<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>タスク管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>タスク管理</h1>
      <p id="summary" class="summary" aria-live="polite"></p>
    </header>

    <form id="task-form" class="task-form" autocomplete="off">
      <label class="field field-title">
        <span class="field-label">タスク</span>
        <input id="task-title" name="title" type="text" required maxlength="200" placeholder="例：請求書を送る">
      </label>
      <label class="field field-due">
        <span class="field-label">期限（任意）</span>
        <input id="task-due" name="due" type="date">
      </label>
      <button type="submit" class="btn btn-primary">追加</button>
    </form>

    <section class="toolbar" aria-label="絞り込み">
      <div class="filters" role="group" aria-label="状態で絞り込み">
        <button type="button" class="filter" data-filter="all" aria-pressed="true">すべて<span class="count" data-count="all"></span></button>
        <button type="button" class="filter" data-filter="active" aria-pressed="false">未完了<span class="count" data-count="active"></span></button>
        <button type="button" class="filter" data-filter="today" aria-pressed="false">今日まで<span class="count" data-count="today"></span></button>
        <button type="button" class="filter" data-filter="overdue" aria-pressed="false">期限切れ<span class="count" data-count="overdue"></span></button>
        <button type="button" class="filter" data-filter="completed" aria-pressed="false">完了<span class="count" data-count="completed"></span></button>
      </div>
      <input id="search" class="search" type="search" placeholder="キーワードで絞り込み" aria-label="キーワードで絞り込み">
    </section>

    <ul id="task-list" class="task-list"></ul>
    <p id="empty" class="empty" hidden></p>

    <footer class="app-footer">
      <button type="button" id="clear-completed" class="btn btn-ghost">完了済みをすべて削除</button>
    </footer>
  </main>

  <template id="task-template">
    <li class="task">
      <label class="task-check">
        <input type="checkbox" class="task-toggle">
        <span class="visually-hidden">完了にする</span>
      </label>
      <div class="task-body">
        <span class="task-title"></span>
        <span class="task-due"></span>
      </div>
      <button type="button" class="task-delete" aria-label="削除">×</button>
    </li>
  </template>
</body>
</html>
