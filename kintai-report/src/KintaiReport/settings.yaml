# =====================================================================
#  勤怠分析レポート 設定ファイル
#  - 文字コードは UTF-8 で保存してください。
#  - 「#」以降はコメントです。インデント（字下げ）は半角スペースで揃えてください。
#  - 時刻は "09:00" のように引用符付きで書いてください。
# =====================================================================

# ---------------------------------------------------------------------
# 入力（勤怠Excel）
# ---------------------------------------------------------------------
input:
  sheetName: 勤怠            # 読み込むシート名
  headerRow: 1               # 見出しのある行番号
  columns:                   # 見出し名（Excel の見出しと一致させる。全角/半角スペースは無視）
    employeeId: 社員番号
    name: 氏名
    department: 部署
    date: 日付
    calendar: カレンダー
    clockIn: 出勤時刻
    clockOut: 退勤時刻
    breakMinutes: 休憩(分)   # 任意。列が無い・空欄なら下の break.rules で計算
    approval: 承認状況
  workdayCalendarValues:     # カレンダー欄がこの値の日を「所定出勤日」とする
    - 平日
  approvedValues:            # 承認欄がこの値なら承認済み（それ以外は未承認者一覧に掲載）
    - 承認済

# ---------------------------------------------------------------------
# レポート
# ---------------------------------------------------------------------
report:
  title: 部署別 月次累計勤怠分析レポート
  companyName: サンプル株式会社
  fiscalYearStartMonth: 4    # 累計の起点月（4 = 4月始まりの年度）
  topOvertimeCount: 20       # 時間外時間 上位N名
  bottomAttendanceCount: 20  # 出勤日数 下位N名
  showDepartmentDetails: true  # 部署ごとの社員別明細ページを出力する
  font:
    families:                # 上から順に使えるフォントを使用（Windows 標準 → Linux 用）
      - Yu Gothic
      - Meiryo
      - MS Gothic
      - IPAexGothic
      - IPAGothic
      - Noto Sans CJK JP
    file: ""                 # フォントファイルを直接指定する場合（例: fonts/ipaexg.ttf）

# ---------------------------------------------------------------------
# 部署の並び順（レポート上の表示順）。ここに無い部署は末尾に名前順で表示
# ---------------------------------------------------------------------
departments:
  order:
    - 総務課
    - 人事課
    - 経理課
    - 営業1課
    - 営業2課
    - 開発課
    - 店舗課

# ---------------------------------------------------------------------
# 所定時間（この時間帯の外で働いた時間が残業）
# ---------------------------------------------------------------------
schedule:
  default:
    start: "09:00"
    end: "18:00"
  byDepartment:              # 部署ごとに異なる場合
    店舗課:
      start: "11:00"
      end: "20:00"

# 深夜時間帯（この時間帯の時間外労働を「深夜残業」として別集計）
lateNight:
  start: "22:00"
  end: "06:00"               # 翌日 6:00

# ---------------------------------------------------------------------
# 休憩ルール
#   拘束時間（退勤 − 出勤）が overMinutes 分を「超えた」とき breakMinutes 分の休憩とみなす。
#   複数当てはまる場合は最も長い休憩を採用。休日出勤にも同じルールを適用。
#   休憩は所定時間内に取得したものとして、所定内の時間から先に差し引きます。
# ---------------------------------------------------------------------
break:
  useExcelBreakColumn: true  # Excel の休憩列に値があればそちらを優先
  rules:
    - overMinutes: 360       # 6時間超 → 45分
      breakMinutes: 45
    - overMinutes: 480       # 8時間超 → 60分
      breakMinutes: 60

# 丸め：1日ごとの普通残業・深夜残業・休日出勤を N 分単位で切り捨て（1 = 丸めなし）
rounding:
  overtimeUnitMinutes: 1

# ---------------------------------------------------------------------
# 集計から除外する社員（社員番号）。役員・出向者・テスト用IDなど
# ---------------------------------------------------------------------
excludedEmployees:
  - E9001
  - E9002

# ---------------------------------------------------------------------
# 社員個別設定：入社日・退職日
#   在籍期間外の平日は所定出勤日に数えません（出勤率・下位ランキングが公平になります）。
#   入社日を書かない場合は、Excel 上で最初に記録がある日を入社日とみなします。
# ---------------------------------------------------------------------
employees:
  - id: E0108
    hireDate: 2026-06-01
  - id: E0109
    hireDate: 2026-08-17
  - id: E0042
    retireDate: 2026-07-31

# ---------------------------------------------------------------------
# 出勤率ヒートマップの色の範囲（0〜1）。minRate 以下が最も濃く、maxRate 以上が最も薄い
# ---------------------------------------------------------------------
heatmap:
  minRate: 0.80
  maxRate: 1.00
